<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0E2B2E">
<title>Pattern</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">
<style>
:root{
  --blanco:#FFFFFF;
  --nieve:#F4F8F9;
  --borde:#DCE7E9;
  --borde-fuerte:#C3D6D9;
  --tinta:#0E2B2E;
  --tinta-suave:#5B7376;
  --celeste:#1E9BD1;
  --celeste-tenue:#E4F2FA;
  --agua:#0FA68A;
  --agua-tenue:#E1F4F0;
  --coral:#B3455A;
  --coral-tenue:#FBEAED;
  --ambar:#B07B1E;
  --ambar-tenue:#FBF2DF;
  --ui:"Bricolage Grotesque",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --lectura:"Newsreader",Georgia,"Times New Roman",serif;
  --r:10px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--blanco);color:var(--tinta);
  font-family:var(--ui);font-size:16px;line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;font-size:inherit;cursor:pointer;color:inherit}
input{font-family:inherit;font-size:inherit;color:inherit}

/* ---------- armazón ---------- */
#app{display:grid;grid-template-columns:272px 1fr;min-height:100vh}
#lateral{
  background:var(--nieve);border-right:1px solid var(--borde);
  padding:26px 0 40px;overflow-y:auto;max-height:100vh;position:sticky;top:0;
}
#principal{padding:44px 56px 120px;max-width:720px}

.marca{padding:0 20px 18px}
.marca h1{
  font-family:var(--ui);font-size:23px;font-weight:600;margin:0;
  letter-spacing:-.025em;
}
.marca .fuente{font-size:12.5px;color:var(--tinta-suave);margin-top:2px}
.marca .avance{font-size:12.5px;color:var(--tinta-suave);margin-top:14px;font-variant-numeric:tabular-nums}
.cuenta{font-size:11.5px;color:var(--tinta-suave);margin-top:6px;display:flex;justify-content:space-between;gap:8px;align-items:center}
.cuenta button{background:none;border:0;color:var(--celeste);font-size:11.5px;padding:0;text-decoration:underline}

.repaso-btn{
  display:block;width:calc(100% - 32px);margin:2px 16px 18px;text-align:left;
  background:var(--ambar-tenue);border:1px solid transparent;border-radius:var(--r);
  padding:11px 14px;
}
.repaso-btn b{display:block;font-size:14px;font-weight:600}
.repaso-btn span{font-size:12px;color:var(--tinta-suave)}
.repaso-btn.activa{border-color:var(--ambar)}
.repaso-btn.vacia{background:var(--blanco);border-color:var(--borde);opacity:.75}

.u-item{
  display:block;width:100%;text-align:left;background:none;border:0;
  padding:9px 20px 9px 17px;border-left:3px solid transparent;
}
.u-item:hover{background:var(--blanco)}
.u-item.activa{border-left-color:var(--celeste);background:var(--blanco)}
.u-item .n{color:var(--tinta-suave);font-variant-numeric:tabular-nums;font-size:12.5px;margin-right:8px}
.u-item .t{font-size:14px}
.u-item .barra{height:3px;background:var(--borde);margin-top:7px;border-radius:2px;overflow:hidden}
.u-item .barra i{display:block;height:100%;background:var(--agua)}
.u-item.completa .t{color:var(--tinta-suave)}
.u-item.completa .n::after{content:" ●";color:var(--agua);font-size:9px;vertical-align:middle}

/* ---------- barra móvil ---------- */
#movil{display:none}

/* ---------- cabecera de unidad ---------- */
.cabecera{margin-bottom:34px}
.cabecera h2{
  font-family:var(--ui);font-size:34px;font-weight:600;margin:0 0 8px;
  letter-spacing:-.03em;line-height:1.1;
}
.cabecera .meta{color:var(--tinta-suave);font-size:13.5px}

/* la rejilla: un punto por pregunta de la unidad */
.rejilla{display:flex;flex-wrap:wrap;gap:5px;margin:20px 0 0}
.rejilla i{
  width:9px;height:9px;border-radius:2px;background:var(--borde);
  display:block;
}
.rejilla i.visto{background:var(--celeste)}
.rejilla i.firme{background:var(--agua)}

.pestanas{display:flex;gap:2px;margin:30px 0 30px;border-bottom:1px solid var(--borde)}
.pestanas button{
  background:none;border:0;border-bottom:2px solid transparent;
  padding:9px 14px;color:var(--tinta-suave);margin-bottom:-1px;font-size:14.5px;
}
.pestanas button.activa{color:var(--tinta);border-bottom-color:var(--celeste);font-weight:500}
.pestanas button .c{font-size:11.5px;color:var(--tinta-suave);margin-left:6px;font-variant-numeric:tabular-nums}

section{margin-bottom:44px}
h3{font-size:15px;font-weight:600;margin:0 0 5px}
.instruccion{color:var(--tinta-suave);font-size:14px;margin:0 0 18px;max-width:62ch}
.seccion-num{
  color:var(--celeste);font-variant-numeric:tabular-nums;
  font-size:12.5px;font-weight:600;margin-right:8px;
}

.explicacion{
  background:var(--nieve);border-radius:var(--r);
  padding:20px 22px;margin-bottom:14px;
}
.explicacion p{margin:0 0 12px;max-width:64ch}
.explicacion p:last-child{margin-bottom:0}
.ejemplo{
  font-family:var(--lectura);font-size:18px;line-height:1.6;
  margin:0 0 6px;color:var(--tinta);
}
.ejemplo .nota{font-family:var(--ui);font-size:12.5px;color:var(--tinta-suave);margin-left:10px}

/* ---------- ejercicios ---------- */
.item{padding:14px 0;border-bottom:1px solid var(--borde)}
.item:last-of-type{border-bottom:0}
.frase{font-family:var(--lectura);font-size:18.5px;line-height:1.75}
.origen{font-size:12.5px;color:var(--tinta-suave);margin-bottom:10px}
.hueco{
  border:0;border-bottom:2px solid var(--celeste);background:var(--celeste-tenue);
  font-family:var(--lectura);font-size:18px;padding:1px 7px;min-width:110px;
  outline:none;border-radius:3px 3px 0 0;
}
.hueco:focus{background:#D2E9F7}
.hueco.ok{border-bottom-color:var(--agua);background:var(--agua-tenue);color:var(--agua)}
.hueco.mal{border-bottom-color:var(--coral);background:var(--coral-tenue);color:var(--coral)}
.libre{
  width:100%;border:1px solid var(--borde-fuerte);border-radius:8px;background:var(--blanco);
  font-family:var(--lectura);font-size:18px;padding:10px 12px;margin-top:8px;outline:none;
}
.libre:focus{border-color:var(--celeste);background:var(--celeste-tenue)}
.opciones{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.opcion{
  background:var(--blanco);border:1px solid var(--borde-fuerte);border-radius:999px;
  padding:6px 16px;font-family:var(--lectura);font-size:17px;
}
.opcion:hover{border-color:var(--celeste)}
.opcion.elegida{border-color:var(--celeste);background:var(--celeste-tenue)}
.opcion.ok{border-color:var(--agua);background:var(--agua-tenue);color:var(--agua)}
.opcion.mal{border-color:var(--coral);background:var(--coral-tenue);color:var(--coral)}
.correccion{font-size:13.5px;margin-top:8px;color:var(--tinta-suave)}
.correccion.ok{color:var(--agua)}
.correccion.mal{color:var(--coral)}
.correccion b{font-family:var(--lectura);font-size:16.5px;font-weight:500}
.pedir-ia{
  background:none;border:0;color:var(--celeste);font-size:13px;
  text-decoration:underline;padding:0;margin-left:10px;
}
.ia{
  background:var(--celeste-tenue);border-radius:8px;
  padding:10px 13px;margin-top:10px;font-size:13.5px;line-height:1.5;
}
.ia.ok{background:var(--agua-tenue)}
.ia.mal{background:var(--coral-tenue)}
.ejemplo-resuelto{opacity:.55}
.ejemplo-resuelto .frase::after{
  content:" ejemplo";font-family:var(--ui);font-size:11px;
  color:var(--tinta-suave);margin-left:8px;
}

.acciones{display:flex;gap:9px;align-items:center;margin-top:20px;flex-wrap:wrap}
.btn{
  background:var(--tinta);color:var(--blanco);border:0;border-radius:999px;
  padding:9px 22px;font-size:14.5px;font-weight:500;
}
.btn:hover{background:#0A2124}
.btn:disabled{opacity:.4;cursor:default}
.btn.sec{background:var(--blanco);color:var(--tinta);border:1px solid var(--borde-fuerte)}
.btn.sec:hover{background:var(--nieve);border-color:var(--celeste)}
.resultado{font-size:13.5px;color:var(--tinta-suave)}

/* ---------- vocabulario ---------- */
.voc{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:1px;background:var(--borde)}
.voc-item{
  display:flex;justify-content:space-between;align-items:baseline;gap:10px;
  padding:11px 12px;background:var(--blanco);
}
.voc-item .en{font-family:var(--lectura);font-size:18px}
.voc-item .nota{font-size:12.5px;color:var(--tinta-suave)}
.voc-item button{
  background:none;border:1px solid var(--borde-fuerte);border-radius:999px;
  font-size:11px;padding:3px 10px;color:var(--tinta-suave);flex-shrink:0;
}
.voc-item button:hover{border-color:var(--agua)}
.voc-item button.sabida{border-color:var(--agua);color:var(--agua);background:var(--agua-tenue)}

.tarjeta{
  background:var(--nieve);border-radius:14px;
  padding:48px 28px;text-align:center;margin-bottom:18px;
}
.tarjeta .en{font-family:var(--lectura);font-size:32px;line-height:1.25}
.tarjeta .oculto{color:var(--tinta-suave);font-size:13.5px;margin-top:14px}

.checklist{list-style:none;padding:0;margin:0}
.checklist li{
  padding:10px 0 10px 26px;position:relative;
  border-bottom:1px solid var(--borde);font-size:15px;
}
.checklist li:last-child{border-bottom:0}
.checklist li::before{
  content:"";position:absolute;left:0;top:15px;
  width:11px;height:11px;border:1.5px solid var(--borde-fuerte);border-radius:3px;
}

.vacio{color:var(--tinta-suave);font-size:14px}
.omitidos{font-size:12.5px;color:var(--tinta-suave);margin-top:10px}


/* ---------- ficha de resumen ---------- */
.ficha{display:grid;gap:14px;margin-bottom:34px}
.bloque{border-radius:14px;padding:20px 22px}
.bloque h4{
  display:flex;align-items:center;gap:10px;
  margin:0 0 14px;font-size:15px;font-weight:600;
}
.bloque h4 .num{
  width:23px;height:23px;border-radius:50%;flex-shrink:0;
  display:grid;place-items:center;font-size:12.5px;color:var(--blanco);
}
.bloque ul{margin:0;padding-left:19px}
.bloque li{margin-bottom:7px;font-size:14.5px}
.bloque li:last-child{margin-bottom:0}
.bloque .clave{
  margin-top:14px;padding:11px 14px;border-radius:8px;
  background:var(--blanco);font-size:14px;
}

.b-concepto{background:var(--celeste-tenue)}
.b-concepto h4 .num{background:var(--celeste)}
.b-estructura{background:#EEF1F8}
.b-estructura h4 .num{background:#3D5A99}
.b-ejemplos{background:var(--agua-tenue)}
.b-ejemplos h4 .num{background:var(--agua)}
.b-ojo{background:var(--coral-tenue)}
.b-ojo h4 .num{background:var(--coral)}

.formula{display:grid;gap:8px;margin-bottom:14px}
.formula-fila{
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  background:var(--blanco);border-radius:8px;padding:9px 12px;
}
.formula-fila .et{font-size:12.5px;font-weight:600;min-width:82px;color:#3D5A99}
.formula-fila .fo{font-family:var(--lectura);font-size:16px}

.par{display:grid;gap:3px;padding:11px 0;border-bottom:1px solid rgba(15,166,138,.22)}
.par:last-child{border-bottom:0}
.par .en{font-family:var(--lectura);font-size:18px}
.par .es{font-size:13.5px;color:var(--tinta-suave)}

.contraste{display:grid;gap:8px;margin-top:14px}
.contraste div{
  background:var(--blanco);border-radius:8px;padding:9px 13px;
  font-family:var(--lectura);font-size:16px;
}
.contraste .mal{color:var(--coral)}
.contraste .mal::before{content:"✕  ";font-family:var(--ui);font-size:12px}
.contraste .bien{color:var(--agua)}
.contraste .bien::before{content:"✓  ";font-family:var(--ui);font-size:12px}

.original{margin-top:8px}
.original summary{
  cursor:pointer;font-size:13.5px;color:var(--tinta-suave);
  padding:10px 0;list-style:none;
}
.original summary::-webkit-details-marker{display:none}
.original summary::before{content:"▸ ";font-size:11px}
.original[open] summary::before{content:"▾ "}
.generar{
  background:var(--nieve);border-radius:var(--r);padding:26px 22px;
  text-align:center;margin-bottom:28px;
}
.generar p{margin:0 0 16px;color:var(--tinta-suave);font-size:14px}

/* ---------- portada ---------- */
#portada{max-width:440px;margin:0 auto;padding:16vh 24px}
#portada h1{font-size:44px;font-weight:600;margin:0 0 6px;letter-spacing:-.035em}
#portada .lema{color:var(--tinta-suave);margin:0 0 30px;font-size:15px}
#portada p{color:var(--tinta-suave);margin:0 0 18px;font-size:14.5px}
#portada input{
  width:100%;border:1px solid var(--borde-fuerte);border-radius:8px;
  padding:11px 13px;margin-bottom:10px;background:var(--blanco);
}
#portada input:focus{outline:none;border-color:var(--celeste);background:var(--celeste-tenue)}
#portada .paso{border-top:1px solid var(--borde);padding-top:24px;margin-top:26px}
#portada .btn{margin-right:8px;margin-bottom:8px}
.err{color:var(--coral);font-size:13.5px;margin-top:10px}
.aviso-ok{color:var(--agua);font-size:13.5px;margin-top:10px}

/* ---------- móvil ---------- */
@media (max-width:860px){
  #app{grid-template-columns:1fr}
  #movil{
    display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:12px 18px;border-bottom:1px solid var(--borde);
    position:sticky;top:0;background:var(--blanco);z-index:30;
  }
  #movil .titulo{font-size:17px;font-weight:600;letter-spacing:-.02em}
  #movil button{
    background:var(--nieve);border:1px solid var(--borde);border-radius:999px;
    padding:6px 15px;font-size:13.5px;
  }
  #lateral{
    position:fixed;top:0;left:0;bottom:0;width:86%;max-width:330px;z-index:40;
    transform:translateX(-102%);max-height:none;
    box-shadow:0 0 0 100vw rgba(14,43,46,0);
  }
  #lateral.abierto{transform:translateX(0)}
  #velo{
    display:none;position:fixed;inset:0;background:rgba(14,43,46,.35);z-index:35;
  }
  #velo.visible{display:block}
  #principal{padding:26px 20px 90px}
  .cabecera h2{font-size:27px}
  .pestanas button{padding:9px 11px;font-size:14px}
  .voc{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:no-preference){
  #lateral{transition:transform .22s ease}
  .u-item,.btn,.opcion,.voc-item button{transition:background .13s ease,border-color .13s ease}
}
:focus-visible{outline:2px solid var(--celeste);outline-offset:2px}
</style>
</head>
<body>

<div id="portada">
  <h1>Pattern</h1>
  <p class="lema">Los patrones del inglés, uno a la vez.</p>
  <p id="portada-texto">Carga el archivo del libro para empezar.</p>

  <div id="paso-libro">
    <input type="file" id="archivo" accept=".json">
    <div class="err" id="error-libro"></div>
  </div>

  <div id="paso-login" class="paso" hidden>
    <p>Entra con tu correo y contraseña para que el progreso te siga entre el computador y el celular.</p>
    <input type="email" id="email" placeholder="tu@correo.com" autocomplete="username">
    <input type="password" id="clave" placeholder="contraseña" autocomplete="current-password">
    <button class="btn" id="btn-entrar">Entrar</button>
    <button class="btn sec" id="btn-crear">Crear cuenta</button>
    <button class="btn sec" id="btn-sin-cuenta">Seguir sin cuenta</button>
    <div class="err" id="error-login"></div>
    <div class="aviso-ok" id="ok-login"></div>
  </div>
</div>

<div id="velo"></div>

<div id="app" hidden>
  <header id="movil">
    <span class="titulo">Pattern</span>
    <button id="btn-menu">Unidades</button>
  </header>

  <nav id="lateral">
    <div class="marca">
      <h1>Pattern</h1>
      <div class="fuente">English for Everyone</div>
      <div class="avance" id="progreso-global"></div>
      <div class="cuenta">
        <span id="quien"></span>
        <button id="btn-salir" hidden>salir</button>
      </div>
      <div class="cuenta"><span id="sync"></span></div>
    </div>
    <button class="repaso-btn" id="btn-repaso"></button>
    <div id="lista-unidades"></div>
  </nav>

  <main id="principal"></main>
</div>

<script type="module">
// ===================================================================
//  CONFIGURACION
//  Pega aqui los dos datos de Supabase:
//  Supabase -> Project Settings -> Data API -> URL y anon public key
//  Si los dejas vacios la app funciona igual, pero guarda el progreso
//  solo en este navegador.
// ===================================================================
const SUPABASE_URL  = "https://upyyigfqefydzisqkjac.supabase.co";
const SUPABASE_ANON = "sb_publishable_jAVf0BlZ4IAyZv7wT2N8yQ_kUzSLy4l";
// ===================================================================

const HAY_NUBE = !!(SUPABASE_URL && SUPABASE_ANON);
let sb = null;
if (HAY_NUBE) {
  const { createClient } = await import("https://esm.sh/@supabase/supabase-js@2");
  sb = createClient(SUPABASE_URL, SUPABASE_ANON);
}

const CLAVE_LOCAL = "efe-progreso-v2";
const ESCALONES = [1, 3, 7, 16, 35, 90];   // dias hasta el proximo repaso segun nivel

let LIBRO = null;
let P = {};
let usuario = null;
let unidadActual = 0;
let pestanaActual = "explicacion";
let enRepaso = false;
let colaRepaso = [];

const $ = s => document.querySelector(s);
const hoy = () => new Date().toISOString().slice(0, 10);
function sumarDias(d){
  const f = new Date();
  f.setDate(f.getDate() + d);
  return f.toISOString().slice(0, 10);
}
function esc(t){
  return String(t == null ? "" : t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}
function normalizar(t){
  return (t||"").toLowerCase()
    .replace(/[\u2018\u2019\u02BC]/g,"'").replace(/[\u201C\u201D]/g,'"')
    .replace(/[.,!?;:]+\s*$/,"").replace(/\s+/g," ").trim();
}
function comparar(dado, esperado){
  if(!dado || !esperado) return false;
  const a = normalizar(dado), b = normalizar(esperado);
  if(a === b) return true;
  if(b.includes(" ") && !a.includes(" ")) return b.split(" ").includes(a);
  return false;
}

/* ================= progreso ================= */
function registro(clave, tipo){
  if(!P[clave]) P[clave] = {tipo, ok:false, intentos:0, aciertos:0, nivel:0, proxima:null, datos:null};
  return P[clave];
}
function guardarLocal(){
  try { localStorage.setItem(CLAVE_LOCAL, JSON.stringify(P)); } catch(e){}
}
function cargarLocal(){
  try { P = JSON.parse(localStorage.getItem(CLAVE_LOCAL)) || {}; } catch(e){ P = {}; }
}
function estado(txt, malo){
  const e = $("#sync");
  if(!e) return;
  e.textContent = txt;
  e.style.color = malo ? "var(--mal)" : "var(--suave)";
}

async function subir(clave){
  guardarLocal();
  if(!usuario || !sb) return;
  const r = P[clave];
  try {
    const {error} = await sb.from("progreso").upsert({
      user_id: usuario.id, clave, tipo: r.tipo, ok: r.ok,
      intentos: r.intentos, aciertos: r.aciertos, nivel: r.nivel,
      proxima: r.proxima, datos: r.datos, actualizado: new Date().toISOString()
    });
    if(error){ console.error("Supabase:", error); estado("no se pudo guardar: " + error.message, true); }
    else estado("guardado");
  } catch(e){
    console.error(e);
    estado("sin conexión, guardado solo aquí", true);
  }
}

/* Sube todo lo local que aun no este en la nube */
async function subirTodo(){
  if(!usuario || !sb) return;
  const filas = Object.keys(P).map(clave => {
    const r = P[clave];
    return {user_id: usuario.id, clave, tipo: r.tipo, ok: r.ok,
            intentos: r.intentos, aciertos: r.aciertos, nivel: r.nivel,
            proxima: r.proxima, datos: r.datos, actualizado: new Date().toISOString()};
  });
  if(!filas.length) return;
  const {error} = await sb.from("progreso").upsert(filas);
  if(error){ console.error("Supabase:", error); estado("no se pudo sincronizar: " + error.message, true); }
  else estado(filas.length + " registros sincronizados");
}
async function bajar(){
  if(!usuario || !sb) return;
  const {data, error} = await sb.from("progreso").select("*").eq("user_id", usuario.id);
  if(error){ console.error("Supabase:", error); estado("no se pudo leer: " + error.message, true); return; }
  if(!data) return;
  data.forEach(f => {
    P[f.clave] = {tipo:f.tipo, ok:f.ok, intentos:f.intentos, aciertos:f.aciertos,
                  nivel:f.nivel, proxima:f.proxima, datos:f.datos};
  });
  guardarLocal();
}
function programar(clave, tipo, acerto){
  const r = registro(clave, tipo);
  r.intentos++;
  if(acerto){
    r.aciertos++;
    r.ok = true;
    r.nivel = Math.min(r.nivel + 1, ESCALONES.length);
  } else {
    r.ok = false;
    r.nivel = Math.max(r.nivel - 1, 0);
  }
  r.proxima = sumarDias(ESCALONES[Math.max(r.nivel - 1, 0)]);
  subir(clave);
}

/* ================= arranque ================= */
let yaInicio = false;

async function cargarLibroDelServidor(){
  try {
    const r = await fetch("EFE_app.json", {cache:"no-cache"});
    if(!r.ok) return false;
    const j = await r.json();
    if(!j.unidades) return false;
    LIBRO = j;
    return true;
  } catch(e){ return false; }
}

$("#archivo").addEventListener("change", e => {
  const f = e.target.files[0];
  if(!f) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const j = JSON.parse(r.result);
      if(!j.unidades) throw new Error();
      LIBRO = j;
      try { localStorage.setItem("efe-libro", r.result); } catch(e){}
      decidirPortada();
    } catch(err){
      $("#error-libro").textContent = "Ese archivo no es el EFE_app.json.";
    }
  };
  r.readAsText(f, "utf-8");
});

/* Con libro y sin sesion: pide login. Con libro y sesion: entra. Sin libro: pide archivo. */
function decidirPortada(){
  if(!LIBRO){
    $("#paso-libro").hidden = false;
    $("#portada-texto").textContent = "Carga el archivo del libro para empezar.";
    return;
  }
  $("#paso-libro").hidden = true;
  $("#portada-texto").textContent = "Libro cargado: " + LIBRO.unidades.length + " unidades.";
  if(HAY_NUBE && !usuario){ $("#paso-login").hidden = false; return; }
  iniciar();
}

function credenciales(){
  const email = $("#email").value.trim();
  const clave = $("#clave").value;
  if(!email || !clave){
    $("#error-login").textContent = "Escribe el correo y la contraseña.";
    return null;
  }
  if(clave.length < 6){
    $("#error-login").textContent = "La contraseña debe tener al menos 6 caracteres.";
    return null;
  }
  return {email, password: clave};
}

$("#btn-entrar").onclick = async () => {
  if(!sb) return;
  $("#error-login").textContent = ""; $("#ok-login").textContent = "";
  const c = credenciales();
  if(!c) return;
  const {data, error} = await sb.auth.signInWithPassword(c);
  if(error){ $("#error-login").textContent = error.message; return; }
  usuario = data.user;
  await bajar();
  decidirPortada();
};

$("#btn-crear").onclick = async () => {
  if(!sb) return;
  $("#error-login").textContent = ""; $("#ok-login").textContent = "Creando cuenta...";
  const c = credenciales();
  if(!c){ $("#ok-login").textContent = ""; return; }
  const {data, error} = await sb.auth.signUp(c);
  if(error){ $("#ok-login").textContent = ""; $("#error-login").textContent = error.message; return; }
  if(data.session){
    usuario = data.user;
    await bajar();
    decidirPortada();
  } else {
    $("#ok-login").textContent = "Cuenta creada. Ahora presiona Entrar.";
  }
};

$("#clave").addEventListener("keydown", e => { if(e.key === "Enter") $("#btn-entrar").click(); });
$("#btn-sin-cuenta").onclick = () => { if(LIBRO) iniciar(); };
$("#btn-salir").onclick = async () => { if(sb) await sb.auth.signOut(); location.reload(); };

(async function(){
  cargarLocal();

  // el libro vive en el servidor: se baja solo en cualquier dispositivo
  const hay = await cargarLibroDelServidor();
  if(!hay){
    const g = localStorage.getItem("efe-libro");
    if(g){ try { LIBRO = JSON.parse(g); } catch(e){} }
  }

  if(HAY_NUBE && sb){
    // el token del enlace del correo se procesa de forma asincrona:
    // hay que escuchar el cambio de sesion, no preguntar una sola vez
    sb.auth.onAuthStateChange(async (evento, sesion) => {
      if(sesion && sesion.user && !yaInicio){
        usuario = sesion.user;
        await bajar();
        if(location.hash.includes("access_token")){
          history.replaceState(null, "", location.pathname);
        }
        decidirPortada();
      }
    });
    const {data} = await sb.auth.getSession();
    if(data && data.session){
      usuario = data.session.user;
      await bajar();
    }
  }
  decidirPortada();
})();

async function iniciar(){
  if(yaInicio) return;
  yaInicio = true;
  if(usuario) await subirTodo();
  document.addEventListener("visibilitychange", async () => {
    if(document.visibilityState === "visible" && usuario){
      await bajar(); pintarLateral();
      if(!enRepaso) pintarUnidad();
    }
  });
  $("#portada").hidden = true;
  $("#app").hidden = false;
  $("#quien").textContent = usuario ? usuario.email : "sin cuenta, solo este navegador";
  $("#btn-salir").hidden = !usuario;
  const u = parseInt(localStorage.getItem("efe-ultima") || "0", 10);
  unidadActual = (u >= 0 && u < LIBRO.unidades.length) ? u : 0;
  pintarLateral();
  pintarUnidad();
}

/* ================= panel lateral en móvil ================= */
function abrirPanel(){
  $("#lateral").classList.add("abierto");
  $("#velo").classList.add("visible");
}
function cerrarPanel(){
  $("#lateral").classList.remove("abierto");
  $("#velo").classList.remove("visible");
}
$("#btn-menu").onclick = () =>
  $("#lateral").classList.contains("abierto") ? cerrarPanel() : abrirPanel();
$("#velo").onclick = cerrarPanel;
document.addEventListener("keydown", e => { if(e.key === "Escape") cerrarPanel(); });

/* ================= avance ================= */
function clavesDeUnidad(u){
  const cl = [];
  u.ejercicios.forEach(ej => {
    if(!ej.activo) return;
    if(ej.tipo === "produccion"){ cl.push(ej.id); return; }
    ej.items.forEach(i => { if(!i.es_ejemplo) cl.push(i.id); });
  });
  return cl;
}
function avanceUnidad(u){
  const cl = clavesDeUnidad(u);
  if(!cl.length) return {hechos:0,total:0,pct:0};
  const hechos = cl.filter(c => P[c] && P[c].ok).length;
  return {hechos, total:cl.length, pct:Math.round(100*hechos/cl.length)};
}

/* ================= cola de repaso ================= */
function construirCola(){
  const h = hoy();
  const cola = [];
  LIBRO.unidades.forEach(u => {
    u.ejercicios.forEach(ej => {
      if(!ej.activo || ej.tipo === "produccion") return;
      ej.items.forEach(it => {
        if(it.es_ejemplo) return;
        const r = P[it.id];
        if(r && r.proxima && r.proxima <= h) cola.push({clase:"item", item:it, ejercicio:ej, unidad:u});
      });
    });
    u.vocabulario.forEach((v,k) => {
      const id = "u" + u.numero + "v" + k;
      const r = P[id];
      if(r && r.proxima && r.proxima <= h) cola.push({clase:"voc", id, voc:v, unidad:u});
    });
  });
  return cola.sort(() => Math.random() - .5);
}

/* ================= lateral ================= */
function pintarLateral(){
  const cont = $("#lista-unidades");
  cont.innerHTML = "";
  let hT = 0, tT = 0;
  LIBRO.unidades.forEach((u, idx) => {
    const a = avanceUnidad(u);
    hT += a.hechos; tT += a.total;
    const b = document.createElement("button");
    b.className = "u-item" + (!enRepaso && idx === unidadActual ? " activa" : "") +
                  (a.total && a.pct === 100 ? " completa" : "");
    b.innerHTML = '<span class="n">'+u.numero+'</span><span class="t">'+esc(u.titulo)+'</span>' +
                  (a.total ? '<span class="barra"><i style="width:'+a.pct+'%"></i></span>' : "");
    b.onclick = () => {
      enRepaso = false; unidadActual = idx; pestanaActual = "explicacion";
      localStorage.setItem("efe-ultima", idx);
      cerrarPanel();
      pintarLateral(); pintarUnidad(); window.scrollTo(0,0);
    };
    cont.appendChild(b);
  });
  $("#progreso-global").textContent = tT ? hT + " de " + tT + " respuestas correctas" : "";

  const pend = construirCola().length;
  const rb = $("#btn-repaso");
  rb.className = "repaso-btn" + (enRepaso ? " activa" : "") + (pend ? "" : " vacia");
  rb.innerHTML = pend
    ? "<b>Repasar hoy</b><span>" + pend + (pend === 1 ? " cosa pendiente" : " cosas pendientes") + "</span>"
    : "<b>Repasar hoy</b><span>nada vencido por ahora</span>";
  rb.onclick = () => {
    if(!pend) return;
    enRepaso = true; colaRepaso = construirCola();
    cerrarPanel();
    pintarLateral(); pintarRepaso(); window.scrollTo(0,0);
  };
}

/* ================= repaso ================= */
function pintarRepaso(){
  const m = $("#principal");
  if(!colaRepaso.length){
    m.innerHTML = '<div class="cabecera"><h2>Repaso terminado</h2>' +
      '<div class="meta">Sigue con una unidad nueva cuando quieras.</div></div>';
    pintarLateral();
    return;
  }
  const n = colaRepaso[0];
  const tmr = document.querySelector("#movil .titulo");
  if(tmr) tmr.textContent = "Repaso";
  m.innerHTML = '<div class="cabecera"><h2>Repaso</h2><div class="meta">' +
    colaRepaso.length + " pendientes · unidad " + n.unidad.numero + ", " + esc(n.unidad.titulo) +
    '</div></div><div id="panel"></div>';
  const panel = $("#panel");

  if(n.clase === "voc"){
    const d = document.createElement("div");
    d.className = "tarjeta";
    d.innerHTML = '<div class="en">' + esc(n.voc.en) + "</div>" +
      '<div class="oculto">¿Sabes qué significa y cómo se usa?</div>';
    panel.appendChild(d);
    if(n.voc.nota){
      const rev = document.createElement("button");
      rev.className = "btn sec"; rev.textContent = "Ver la nota del libro";
      rev.onclick = () => {
        const p = document.createElement("p");
        p.className = "instruccion"; p.textContent = n.voc.nota;
        rev.replaceWith(p);
      };
      panel.appendChild(rev);
    }
    const acc = document.createElement("div"); acc.className = "acciones";
    const si = document.createElement("button"); si.className = "btn"; si.textContent = "La sé";
    const no = document.createElement("button"); no.className = "btn sec"; no.textContent = "No la sé";
    si.onclick = () => { programar(n.id,"voc",true);  colaRepaso.shift(); pintarRepaso(); };
    no.onclick = () => { programar(n.id,"voc",false); colaRepaso.shift(); pintarRepaso(); };
    acc.append(si,no); panel.appendChild(acc);
    return;
  }

  const s = document.createElement("section");
  s.innerHTML = '<p class="origen">' + esc(n.ejercicio.seccion || "") + " · " +
                esc(n.ejercicio.instruccion) + "</p>";
  const d = cajaItem(n.item);
  s.appendChild(d);
  const acc = document.createElement("div"); acc.className = "acciones";
  const rev = document.createElement("button"); rev.className = "btn"; rev.textContent = "Revisar";
  const sig = document.createElement("button"); sig.className = "btn sec"; sig.textContent = "Saltar";
  rev.onclick = () => {
    const dado = leerRespuesta(d);
    const bien = comparar(dado, n.item.respuesta);
    pintarCorreccion(d, n.item, dado, bien, n.ejercicio);
    programar(n.item.id, "item", bien);
    rev.disabled = true; sig.textContent = "Siguiente";
  };
  sig.onclick = () => { colaRepaso.shift(); pintarRepaso(); };
  acc.append(rev,sig); s.appendChild(acc);
  panel.appendChild(s);
}

/* ================= unidad ================= */
function pintarUnidad(){
  const u = LIBRO.unidades[unidadActual];
  const m = $("#principal");
  const a = avanceUnidad(u);
  const nEj = u.ejercicios.filter(e => e.activo).length;
  const omit = u.ejercicios.filter(e => !e.activo).length;

  m.innerHTML =
    '<div class="cabecera"><h2>' + esc(u.titulo) + "</h2>" +
    '<div class="meta">Unidad ' + u.numero + " · páginas " + u.paginas[0] + "–" + u.paginas[1] +
    (a.total ? " · " + a.hechos + "/" + a.total + " resueltas" : "") + "</div>" +
    rejillaHTML(u) + "</div>" +
    '<div class="pestanas">' +
      tab("explicacion","Explicación", P[claveResumen(u)] ? 0 : u.explicaciones.length) +
      tab("practicar","Practicar",nEj) +
      tab("vocabulario","Vocabulario",u.vocabulario.length) +
    '</div><div id="panel"></div>';

  m.querySelectorAll(".pestanas button").forEach(b => {
    b.onclick = () => { pestanaActual = b.dataset.t; pintarUnidad(); };
  });

  const tm = document.querySelector("#movil .titulo");
  if(tm) tm.textContent = u.titulo;

  const panel = $("#panel");
  if(pestanaActual === "explicacion") panelExplicacion(panel, u);
  else if(pestanaActual === "practicar") panelPracticar(panel, u, omit);
  else panelVocabulario(panel, u);
}
function rejillaHTML(u){
  const cl = clavesDeUnidad(u);
  if(!cl.length) return "";
  const puntos = cl.map(c => {
    const r = P[c];
    if(!r || !r.intentos) return "<i></i>";
    if(r.ok && r.nivel >= 3) return '<i class="firme"></i>';
    if(r.ok) return '<i class="visto"></i>';
    return "<i></i>";
  }).join("");
  return '<div class="rejilla">' + puntos + "</div>";
}

function tab(id, txt, n){
  return '<button data-t="'+id+'" class="'+(pestanaActual===id?"activa":"")+'">' +
         txt + (n ? '<span class="c">'+n+"</span>" : "") + "</button>";
}

/* ================= practicar ================= */
function panelPracticar(panel, u, omit){
  const activos = u.ejercicios.filter(e => e.activo);
  if(!activos.length){
    panel.innerHTML = '<p class="vacio">Esta unidad no tiene ejercicios para responder.</p>';
    return;
  }
  activos.forEach(ej => {
    const s = document.createElement("section");
    s.innerHTML = "<h3><span class=\"seccion-num\">" + esc(ej.seccion||"") + "</span></h3>" +
                  '<p class="instruccion">' + esc(ej.instruccion) + "</p>";
    if(ej.tipo === "produccion") bloqueProduccion(s, ej);
    else bloqueNormal(s, ej);
    panel.appendChild(s);
  });
  if(omit){
    const p = document.createElement("p");
    p.className = "omitidos";
    p.textContent = omit + (omit === 1 ? " ejercicio de audio omitido" : " ejercicios de audio omitidos") + " en esta unidad.";
    panel.appendChild(p);
  }
}

function cajaItem(it){
  const d = document.createElement("div");
  d.className = "item";
  d.dataset.item = it.id;
  if(it.opciones && it.opciones.length){
    d.innerHTML = '<div class="frase">' + esc(it.prompt) + "</div>";
    const box = document.createElement("div"); box.className = "opciones";
    it.opciones.forEach(op => {
      const b = document.createElement("button");
      b.className = "opcion"; b.textContent = op; b.dataset.v = op;
      b.onclick = () => {
        box.querySelectorAll(".opcion").forEach(x => x.classList.remove("elegida"));
        b.classList.add("elegida");
      };
      box.appendChild(b);
    });
    d.appendChild(box);
  } else {
    const partes = it.prompt.split(/_{2,}/);
    const frase = document.createElement("div"); frase.className = "frase";
    if(partes.length > 1){
      partes.forEach((t,k) => {
        frase.appendChild(document.createTextNode(t));
        if(k < partes.length - 1){
          const inp = document.createElement("input");
          inp.className = "hueco"; inp.type = "text";
          inp.setAttribute("aria-label","respuesta");
          frase.appendChild(inp);
        }
      });
      d.appendChild(frase);
    } else {
      frase.textContent = it.prompt;
      d.appendChild(frase);
      const inp = document.createElement("input");
      inp.className = "libre"; inp.type = "text";
      inp.placeholder = "Escribe tu respuesta";
      d.appendChild(inp);
    }
  }
  const c = document.createElement("div"); c.className = "correccion"; c.hidden = true;
  d.appendChild(c);
  return d;
}

function bloqueNormal(s, ej){
  const cont = document.createElement("div");
  ej.items.forEach(it => {
    if(it.es_ejemplo){
      const d = document.createElement("div");
      d.className = "item ejemplo-resuelto";
      d.innerHTML = '<div class="frase">' + esc(it.prompt.replace(/_{2,}/g, it.respuesta || "___")) + "</div>";
      cont.appendChild(d);
      return;
    }
    const d = cajaItem(it);
    const r = P[it.id];
    if(r && r.ok){
      const c = d.querySelector(".correccion");
      c.hidden = false; c.className = "correccion ok";
      c.textContent = "Resuelta antes · vuelve el " + (r.proxima || "—");
    }
    cont.appendChild(d);
  });
  s.appendChild(cont);

  const acc = document.createElement("div"); acc.className = "acciones";
  const rev = document.createElement("button"); rev.className = "btn"; rev.textContent = "Revisar";
  const ver = document.createElement("button"); ver.className = "btn sec"; ver.textContent = "Ver respuestas";
  const res = document.createElement("span"); res.className = "resultado";
  acc.append(rev, ver, res); s.appendChild(acc);

  rev.onclick = () => {
    let ok = 0, tot = 0;
    ej.items.forEach(it => {
      if(it.es_ejemplo) return;
      const d = s.querySelector('[data-item="' + it.id + '"]');
      if(!d) return;
      tot++;
      const dado = leerRespuesta(d);
      const bien = comparar(dado, it.respuesta);
      if(bien) ok++;
      pintarCorreccion(d, it, dado, bien, ej);
      programar(it.id, "item", bien);
    });
    pintarLateral();
    res.textContent = ok + " de " + tot + " correctas";
  };
  ver.onclick = () => {
    ej.items.forEach(it => {
      if(it.es_ejemplo) return;
      const d = s.querySelector('[data-item="' + it.id + '"]');
      if(!d) return;
      const c = d.querySelector(".correccion");
      c.hidden = false; c.className = "correccion";
      c.innerHTML = "Respuesta: <b>" + esc(it.respuesta) + "</b>";
    });
  };
}

function leerRespuesta(d){
  const sel = d.querySelector(".opcion.elegida");
  if(sel) return sel.dataset.v;
  const huecos = [...d.querySelectorAll(".hueco")];
  if(huecos.length) return huecos.map(h => h.value).join(" ").trim();
  const libre = d.querySelector(".libre");
  return libre ? libre.value.trim() : "";
}

function pintarCorreccion(d, it, dado, bien, ej){
  const c = d.querySelector(".correccion");
  c.hidden = false;
  c.className = "correccion " + (bien ? "ok" : "mal");
  d.querySelectorAll(".hueco").forEach(h => {
    h.classList.remove("ok","mal"); h.classList.add(bien ? "ok" : "mal");
  });
  const sel = d.querySelector(".opcion.elegida");
  if(sel){ sel.classList.remove("elegida"); sel.classList.add(bien ? "ok" : "mal"); }

  if(bien){ c.textContent = "Correcto"; return; }
  c.innerHTML = (dado ? "" : "Sin responder. ") + "Respuesta: <b>" + esc(it.respuesta) + "</b>";
  if(dado){
    const b = document.createElement("button");
    b.className = "pedir-ia"; b.textContent = "creo que la mía también vale";
    b.onclick = () => revisarConIA(d, {
      modo:"normal", instruccion:ej.instruccion, prompt:it.prompt,
      esperada:it.respuesta, dada:dado
    }, it.id, b);
    c.appendChild(b);
  }
}

async function revisarConIA(d, cuerpo, clave, boton){
  boton.textContent = "consultando...";
  boton.disabled = true;
  const caja = document.createElement("div");
  caja.className = "ia";
  caja.textContent = "Revisando tu respuesta...";
  d.appendChild(caja);
  try {
    const r = await fetch("/api/corregir", {
      method:"POST", headers:{"content-type":"application/json"},
      body: JSON.stringify(cuerpo)
    });
    const j = await r.json();
    if(j.error){ caja.textContent = "No se pudo consultar: " + j.error; boton.remove(); return; }
    caja.className = "ia " + (j.correcto ? "ok" : "mal");
    caja.textContent = j.explicacion || (j.correcto ? "Es válida." : "No es válida.");
    if(j.correcto && clave){
      programar(clave, "item", true);
      const c = d.querySelector(".correccion");
      c.className = "correccion ok";
      c.textContent = "Aceptada";
      c.appendChild(caja);
      pintarLateral();
    }
    boton.remove();
  } catch(e){
    caja.textContent = "No se pudo consultar. Esto solo funciona con la app publicada en Vercel.";
    boton.disabled = false;
    boton.textContent = "reintentar";
  }
}

/* ================= producción libre ================= */
function bloqueProduccion(s, ej){
  const objetivo = ej.objetivo || 5;
  const r = registro(ej.id, "produccion");
  if(!r.datos || !r.datos.frases) r.datos = {frases:[]};

  const cont = document.createElement("div");
  const lista = document.createElement("div");
  cont.appendChild(lista);

  const inp = document.createElement("input");
  inp.className = "libre"; inp.type = "text";
  inp.placeholder = "Escribe una oración y presiona Enter";
  cont.appendChild(inp);

  const res = document.createElement("div");
  res.className = "resultado"; res.style.marginTop = "10px";
  cont.appendChild(res);
  s.appendChild(cont);

  function refrescar(){
    lista.innerHTML = "";
    r.datos.frases.forEach((f, idx) => {
      const d = document.createElement("div"); d.className = "item";
      d.innerHTML = '<div class="frase">' + esc(f.texto) + "</div>";
      const c = document.createElement("div");
      c.className = "correccion " + (f.ok ? "ok" : "mal");
      c.textContent = f.ok ? "Válida" : "No coincide con las oraciones de la tabla";
      if(!f.ok && !f.ia){
        const b = document.createElement("button");
        b.className = "pedir-ia"; b.textContent = "revisar con IA";
        b.onclick = () => revisarProduccionIA(ej, idx, b, refrescar);
        c.appendChild(b);
      }
      d.appendChild(c);
      if(f.ia){
        const caja = document.createElement("div");
        caja.className = "ia " + (f.ok ? "ok" : "mal");
        caja.textContent = f.ia;
        d.appendChild(caja);
      }
      lista.appendChild(d);
    });
    const ok = r.datos.frases.filter(f => f.ok).length;
    res.textContent = ok + " de " + objetivo + " oraciones válidas";
    const logrado = ok >= objetivo;
    if(logrado !== r.ok) programar(ej.id, "produccion", logrado);
    else subir(ej.id);
    pintarLateral();
  }

  inp.addEventListener("keydown", e => {
    if(e.key !== "Enter") return;
    const txt = inp.value.trim();
    if(!txt) return;
    const bien = (ej.validas || []).some(v => comparar(txt, v));
    r.datos.frases.push({texto:txt, ok:bien});
    inp.value = "";
    refrescar();
  });
  refrescar();
}

async function revisarProduccionIA(ej, idx, boton, refrescar){
  boton.textContent = "consultando...";
  boton.disabled = true;
  const r = P[ej.id];
  try {
    const resp = await fetch("/api/corregir", {
      method:"POST", headers:{"content-type":"application/json"},
      body: JSON.stringify({modo:"produccion", dada:r.datos.frases[idx].texto, validas:ej.validas})
    });
    const j = await resp.json();
    if(j.error){ boton.textContent = "no disponible"; return; }
    r.datos.frases[idx].ok = !!j.correcto;
    r.datos.frases[idx].ia = j.explicacion || "";
    refrescar();
  } catch(e){
    boton.disabled = false;
    boton.textContent = "reintentar";
  }
}


/* ================= ficha de resumen ================= */
function claveResumen(u){ return "resumen:u" + u.numero; }

async function generarResumen(u, boton){
  boton.disabled = true;
  boton.textContent = "Generando...";
  const cont = boton.parentElement;
  try {
    const r = await fetch("/api/resumen", {
      method:"POST", headers:{"content-type":"application/json"},
      body: JSON.stringify({
        titulo: u.titulo,
        explicaciones: u.explicaciones.map(e => ({titulo:e.titulo, texto:e.texto})),
        ejemplos: u.explicaciones.flatMap(e => (e.ejemplos||[]).map(x => x.en)).filter(Boolean),
        vocabulario: u.vocabulario.map(v => v.en)
      })
    });
    const j = await r.json();
    if(j.error){
      cont.querySelector("p").textContent = "No se pudo generar: " + j.error;
      boton.disabled = false; boton.textContent = "Reintentar";
      return;
    }
    const reg = registro(claveResumen(u), "resumen");
    reg.datos = j;
    reg.ok = true;
    await subir(claveResumen(u));
    pintarUnidad();
  } catch(e){
    cont.querySelector("p").textContent = "No se pudo conectar. Esto funciona con la app publicada en Vercel.";
    boton.disabled = false; boton.textContent = "Reintentar";
  }
}

function li(arr){ return (arr||[]).map(t => "<li>" + esc(t) + "</li>").join(""); }

function fichaHTML(f){
  let h = '<div class="ficha">';

  if(f.concepto){
    h += '<div class="bloque b-concepto"><h4><span class="num">1</span>De qué se trata</h4>' +
         "<ul>" + li(f.concepto.puntos) + "</ul>" +
         (f.concepto.clave ? '<div class="clave">' + esc(f.concepto.clave) + "</div>" : "") +
         "</div>";
  }

  if(f.estructura){
    h += '<div class="bloque b-estructura"><h4><span class="num">2</span>Cómo se arma</h4>';
    const filas = f.estructura.filas || [];
    if(filas.length){
      h += '<div class="formula">' + filas.map(x =>
        '<div class="formula-fila"><span class="et">' + esc(x.etiqueta || "") +
        '</span><span class="fo">' + esc(x.formula || "") + "</span></div>").join("") + "</div>";
    }
    if((f.estructura.notas || []).length) h += "<ul>" + li(f.estructura.notas) + "</ul>";
    h += "</div>";
  }

  if((f.ejemplos || []).length){
    h += '<div class="bloque b-ejemplos"><h4><span class="num">3</span>Ejemplos</h4>' +
         f.ejemplos.map(x =>
           '<div class="par"><span class="en">' + esc(x.en || "") +
           '</span><span class="es">' + esc(x.es || "") + "</span></div>").join("") +
         "</div>";
  }

  if(f.ojo){
    h += '<div class="bloque b-ojo"><h4><span class="num">4</span>Ojo con esto</h4>' +
         "<ul>" + li(f.ojo.puntos) + "</ul>";
    if(f.ojo.mal || f.ojo.bien){
      h += '<div class="contraste">' +
           (f.ojo.mal ? '<div class="mal">' + esc(f.ojo.mal) + "</div>" : "") +
           (f.ojo.bien ? '<div class="bien">' + esc(f.ojo.bien) + "</div>" : "") +
           "</div>";
    }
    h += "</div>";
  }

  return h + "</div>";
}

/* ================= explicación ================= */
function panelExplicacion(panel, u){
  const reg = P[claveResumen(u)];
  const ficha = reg && reg.datos;

  if(ficha){
    const d = document.createElement("div");
    d.innerHTML = fichaHTML(ficha);
    panel.appendChild(d);
  } else {
    const g = document.createElement("div");
    g.className = "generar";
    g.innerHTML = "<p>Arma un resumen en español de esta unidad: de qué se trata, " +
                  "cómo se construye, ejemplos traducidos y los errores típicos.</p>";
    const b = document.createElement("button");
    b.className = "btn";
    b.textContent = "Generar resumen";
    b.onclick = () => generarResumen(u, b);
    g.appendChild(b);
    panel.appendChild(g);
  }

  // el texto original del libro queda disponible, plegado
  if(u.explicaciones.length){
    const det = document.createElement("details");
    det.className = "original";
    det.innerHTML = "<summary>Ver el texto original del libro, en inglés</summary>";
    u.explicaciones.forEach(e => {
      const d = document.createElement("div"); d.className = "explicacion";
      let h = "";
      if(e.titulo) h += "<h3>" + (e.seccion ? '<span class="seccion-num">'+esc(e.seccion)+"</span>" : "") + esc(e.titulo) + "</h3>";
      if(e.texto) h += "<p>" + esc(e.texto) + "</p>";
      (e.ejemplos || []).forEach(x => {
        h += '<p class="ejemplo">' + esc(x.en || "") +
             (x.nota ? '<span class="nota">' + esc(x.nota) + "</span>" : "") + "</p>";
      });
      d.innerHTML = h;
      det.appendChild(d);
    });
    panel.appendChild(det);
  } else if(ficha){
    // nada mas que mostrar
  } else {
    const p = document.createElement("p");
    p.className = "vacio";
    p.textContent = "Esta unidad no trae explicación en el libro, pero igual puedes generar un resumen.";
    panel.appendChild(p);
  }

  if(u.checklist && u.checklist.length){
    const sec = document.createElement("section");
    sec.innerHTML = "<h3>Al terminar esta unidad deberías poder</h3>";
    const ul = document.createElement("ul"); ul.className = "checklist";
    u.checklist.forEach(c => { const l = document.createElement("li"); l.textContent = c; ul.appendChild(l); });
    sec.appendChild(ul); panel.appendChild(sec);
  }
}

/* ================= vocabulario ================= */
function panelVocabulario(panel, u){
  if(!u.vocabulario.length){
    panel.innerHTML = '<p class="vacio">Sin vocabulario en esta unidad.</p>';
    return;
  }
  const p = document.createElement("p");
  p.className = "instruccion";
  p.textContent = "Marca lo que ya manejas. Lo marcado entra al repaso y vuelve a aparecer más adelante.";
  panel.appendChild(p);

  const cont = document.createElement("div"); cont.className = "voc";
  u.vocabulario.forEach((v, k) => {
    const id = "u" + u.numero + "v" + k;
    const d = document.createElement("div"); d.className = "voc-item";
    d.innerHTML = '<span><span class="en">' + esc(v.en) + "</span>" +
                  (v.nota ? '<span class="nota"> ' + esc(v.nota) + "</span>" : "") + "</span>";
    const b = document.createElement("button");
    const pintar = () => {
      const r = P[id];
      b.textContent = r && r.ok ? "la sé" : "marcar";
      b.className = r && r.ok ? "sabida" : "";
    };
    b.onclick = () => {
      const r = P[id];
      programar(id, "voc", !(r && r.ok));
      pintar(); pintarLateral();
    };
    pintar(); d.appendChild(b); cont.appendChild(d);
  });
  panel.appendChild(cont);
}
</script>
