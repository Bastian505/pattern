<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0E2B2E">
<title>Pattern</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;500;600;700&family=Newsreader:opsz,wght@6..72,400;6..72,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/estilos.css">
</head>
<body>

<!-- portada / acceso -->
<div id="portada">
  <h1>Pattern</h1>
  <p class="lema">Los patrones del inglés, uno a la vez.</p>
  <p id="portada-texto">Entra con tu correo y contraseña para que el progreso te siga entre dispositivos.</p>
  <input type="email" id="email" placeholder="tu@correo.com" autocomplete="username">
  <input type="password" id="clave" placeholder="contraseña" autocomplete="current-password">
  <div class="botones">
    <button class="btn" id="btn-entrar">Entrar</button>
    <button class="btn sec" id="btn-crear">Crear cuenta</button>
    <button class="btn sec" id="btn-sin-cuenta">Seguir sin cuenta</button>
  </div>
  <div class="err" id="error-login"></div>
  <div class="ok" id="ok-login"></div>
</div>

<!-- aplicación -->
<div id="velo"></div>
<div id="marco" hidden>
  <header id="movil">
    <span class="t" id="titulo-movil">Pattern</span>
    <button id="menu">Menú</button>
  </header>

  <nav id="lado">
    <div class="marca">
      <h1>Pattern</h1>
      <p id="sub-nivel"></p>
      <div class="cuenta">
        <span id="quien"></span>
        <button id="btn-salir" hidden>salir</button>
      </div>
      <div class="cuenta"><span id="sync"></span></div>
    </div>

    <div id="secciones"></div>
    <div id="lista"></div>
  </nav>

  <main id="salida"></main>
</div>

<script type="module" src="js/app.js"></script>
</body>
</html>
